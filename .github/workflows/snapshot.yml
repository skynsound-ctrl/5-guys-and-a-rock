name: Daily data snapshot

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC every day
  workflow_dispatch: {}     # lets you trigger it by hand from the Actions tab

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/snapshot.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Daily data snapshot"
          git push
