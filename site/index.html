<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Hub — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --chrome:#0B0E13;
  --chrome-2:#161B23;
  --page:#EEF0F4;
  --card:#FFFFFF;
  --ink:#0B0E13;
  --ink-2:#5A6472;
  --ink-3:#8B95A3;
  --rule:#DCE0E7;
  --live:#D02F32;
  --gold:#C8A24A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:600;letter-spacing:.01em}
.eyebrow{
  font-family:"Barlow Condensed",sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
}

/* chrome */
.nav{background:var(--chrome);color:#fff}
.nav-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.wordmark{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.nav a{color:rgba(255,255,255,.72);text-decoration:none;font-size:13px;font-weight:500}
.nav a:hover{color:#fff}
.weekpill{margin-left:auto;display:flex;align-items:center;gap:10px}
.weekpill span{font-size:12px;color:rgba(255,255,255,.6)}

/* setup bar */
.setup{background:var(--chrome-2);border-top:1px solid rgba(255,255,255,.08)}
.setup-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.setup label{color:rgba(255,255,255,.7);font-size:13px}
.setup input{
  background:#fff;border:1px solid transparent;border-radius:4px;
  padding:8px 11px;font:inherit;font-size:14px;width:270px;
}
.setup input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{
  background:#fff;color:var(--chrome);border:0;border-radius:4px;
  padding:9px 16px;font-family:"Barlow Condensed",sans-serif;font-weight:600;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
}
.btn:hover{background:var(--gold)}
.btn:disabled{opacity:.5;cursor:default}
.btn-ghost{background:transparent;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.25)}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff}
.hint{color:rgba(255,255,255,.45);font-size:12px}

/* scoreboard rail — the signature element */
.rail{background:var(--chrome);border-top:1px solid rgba(255,255,255,.08);overflow-x:auto}
.rail-in{max-width:1180px;margin:0 auto;display:flex;gap:1px;padding:0 20px}
.tile{
  flex:0 0 226px;background:var(--chrome-2);padding:11px 13px 9px;
  border-top:3px solid #3A4353;color:#fff;
}
.tile.is-live{border-top-color:var(--live)}
.tile-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.tile-status{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.tile.is-live .tile-status{color:var(--live)}
.tile-left{font-size:11px;color:rgba(255,255,255,.4)}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.row-name{font-size:13px;color:rgba(255,255,255,.85);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
.row.win .row-name{color:#fff;font-weight:600}
.row-score{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;color:rgba(255,255,255,.6)}
.row.win .row-score{color:#fff}

/* body */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:2px}
.card-head{padding:11px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
.card-head h2{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;letter-spacing:.06em;text-transform:uppercase}

/* matchup blocks */
.match{padding:15px 16px;border-bottom:1px solid var(--rule)}
.match:last-child{border-bottom:0}
.match-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.side{display:flex;flex-direction:column;gap:2px;min-width:0}
.side.right{text-align:right}
.side-name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-meta{font-size:12px;color:var(--ink-2)}
.side-score{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:34px;line-height:1}
.side-score.lead{color:var(--ink)}
.side-score.trail{color:var(--ink-3)}
.vs{font-family:"Barlow Condensed",sans-serif;font-size:13px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.bar{height:4px;background:var(--rule);margin-top:12px;display:flex;border-radius:2px;overflow:hidden}
.bar i{display:block;background:var(--chrome)}
.bar i+i{background:var(--ink-3)}

/* standings */
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
  text-align:right;padding:8px 16px;border-bottom:1px solid var(--rule);
}
th:first-child,td:first-child{text-align:left}
td{padding:9px 16px;border-bottom:1px solid #EDEFF3;text-align:right}
tr:last-child td{border-bottom:0}
tbody tr.cut{border-bottom:2px solid var(--gold)}
.seed{color:var(--ink-3);font-size:12px;display:inline-block;width:16px}
.tname{font-weight:500}

.notice{padding:16px;background:#FFF7E6;border:1px solid #F0D9A0;border-radius:2px;font-size:14px;margin-bottom:18px}
.notice.bad{background:#FDECEC;border-color:#F0BDBD}
.notice strong{display:block;font-weight:600;margin-bottom:3px}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--ink-3);font-size:12px}
.foot a{color:var(--ink-2)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <div class="wordmark">League Hub</div>
    <a href="#scores">Scores</a>
    <a href="#standings">Standings</a>
    <a href="#" id="sleeperLink" target="_blank" rel="noopener">Open in Sleeper</a>
    <div class="weekpill"><span id="weekLabel">Not loaded</span></div>
  </div>
</nav>

<div class="setup">
  <div class="setup-in">
    <label for="lid">Sleeper league ID</label>
    <input id="lid" inputmode="numeric" placeholder="e.g. 1048291733487382528" autocomplete="off">
    <button class="btn" id="go">Load league</button>
    <button class="btn btn-ghost" id="names" disabled>Load player names</button>
    <span class="hint" id="hint">Find it in your Sleeper league URL, after /leagues/</span>
  </div>
</div>

<div class="rail" id="rail" hidden><div class="rail-in" id="railIn"></div></div>

<div class="wrap">
  <main>
    <div id="msg"></div>
    <section class="card" id="scores">
      <div class="card-head"><h2>Matchups</h2><span class="eyebrow" style="color:var(--ink-3)" id="scoresSub"></span></div>
      <div id="matchups"><div class="empty">Enter a league ID above to load live data from Sleeper.</div></div>
    </section>
  </main>
  <aside>
    <section class="card" id="standings">
      <div class="card-head"><h2>Standings</h2></div>
      <div id="standingsBody"><div class="empty">—</div></div>
    </section>
  </aside>
</div>

<div class="foot">
  Prototype. Data via the public <a href="https://docs.sleeper.com/" target="_blank" rel="noopener">Sleeper API</a>. Nothing is stored — everything is fetched fresh in your browser.
</div>

<script>
const API = "https://api.sleeper.app/v1";
const $ = id => document.getElementById(id);
const round = n => (Math.round((Number(n)||0)*100)/100).toFixed(2);

let PLAYERS = null;

function note(html, bad){
  $("msg").innerHTML = '<div class="notice'+(bad?" bad":"")+'">'+html+'</div>';
}
function clearNote(){ $("msg").innerHTML = ""; }

async function get(path){
  const r = await fetch(API + path);
  if(r.status === 404) throw new Error("NOT_FOUND");
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function load(){
  const id = $("lid").value.trim().replace(/\D/g,"");
  if(!id){ note("Enter your league ID first. It's the long number in your Sleeper league URL.", true); return; }
  $("go").disabled = true; $("go").textContent = "Loading…";
  clearNote();

  try{
    const state = await get("/state/nfl");
    const week = state.display_week || state.week || 1;

    const [league, users, rosters, matchups] = await Promise.all([
      get("/league/" + id),
      get("/league/" + id + "/users"),
      get("/league/" + id + "/rosters"),
      get("/league/" + id + "/matchups/" + week).catch(() => [])
    ]);

    document.querySelector(".wordmark").textContent = league.name || "League Hub";
    document.title = (league.name || "League Hub") + " — prototype";
    $("weekLabel").textContent = "Week " + week + " · " + league.season + " " +
      (state.season_type === "regular" ? "regular season" : state.season_type);
    $("sleeperLink").href = "https://sleeper.com/leagues/" + id;
    $("scoresSub").textContent = "Week " + week;
    $("names").disabled = false;

    const byUser = {}; users.forEach(u => byUser[u.user_id] = u);
    const team = {};
    rosters.forEach(r => {
      const u = byUser[r.owner_id] || {};
      const s = r.settings || {};
      team[r.roster_id] = {
        id: r.roster_id,
        name: (u.metadata && u.metadata.team_name) || u.display_name || ("Roster " + r.roster_id),
        owner: u.display_name || "Unclaimed",
        w: s.wins||0, l: s.losses||0, t: s.ties||0,
        pf: (s.fpts||0) + (s.fpts_decimal||0)/100,
        pa: (s.fpts_against||0) + (s.fpts_against_decimal||0)/100
      };
    });

    renderStandings(Object.values(team));
    renderMatchups(matchups, team);

    if(!matchups.length){
      note("<strong>No matchups yet for week " + week + "</strong>Standings loaded fine. This is normal in the preseason — Sleeper doesn't publish matchups until the schedule is set.");
    }
  }catch(err){
    if(err.message === "NOT_FOUND"){
      note("<strong>League not found</strong>Double-check the ID. It should be an 18-digit number from your Sleeper URL, not your username.", true);
    }else if(err instanceof TypeError){
      note("<strong>The browser blocked the request</strong>If you're viewing this inside a preview pane, download the file and open it directly from your computer instead. That's a sandbox restriction, not a problem with the code.", true);
    }else{
      note("<strong>Couldn't load</strong>" + err.message, true);
    }
  }finally{
    $("go").disabled = false; $("go").textContent = "Load league";
  }
}

function renderMatchups(list, team){
  const rail = $("railIn"), out = $("matchups");
  rail.innerHTML = ""; out.innerHTML = "";
  if(!list.length){ out.innerHTML = '<div class="empty">No matchups published for this week.</div>'; $("rail").hidden = true; return; }

  const games = {};
  list.forEach(m => { (games[m.matchup_id] = games[m.matchup_id] || []).push(m); });
  $("rail").hidden = false;

  Object.keys(games).sort((a,b)=>a-b).forEach(k => {
    const g = games[k]; if(g.length < 2) return;
    const a = g[0], b = g[1];
    const ta = team[a.roster_id]||{name:"?"}, tb = team[b.roster_id]||{name:"?"};
    const pa = Number(a.points)||0, pb = Number(b.points)||0;
    const live = pa > 0 || pb > 0;

    const tile = document.createElement("div");
    tile.className = "tile" + (live ? " is-live" : "");
    tile.innerHTML =
      '<div class="tile-head"><span class="tile-status">'+(live?"In progress":"Not started")+'</span>'+
      '<span class="tile-left">'+starterCount(a)+' starters</span></div>'+
      rowHTML(ta.name, pa, pa>=pb && live) + rowHTML(tb.name, pb, pb>pa && live);
    rail.appendChild(tile);

    const total = pa + pb || 1;
    const el = document.createElement("div");
    el.className = "match";
    el.innerHTML =
      '<div class="match-grid">'+
        '<div class="side"><span class="side-name">'+esc(ta.name)+'</span>'+
          '<span class="side-meta">'+esc(ta.owner)+' · '+ta.w+'-'+ta.l+'</span>'+
          '<span class="side-score num '+(pa>=pb?"lead":"trail")+'">'+round(pa)+'</span></div>'+
        '<div class="vs">'+(live?"Live":"vs")+'</div>'+
        '<div class="side right"><span class="side-name">'+esc(tb.name)+'</span>'+
          '<span class="side-meta">'+esc(tb.owner)+' · '+tb.w+'-'+tb.l+'</span>'+
          '<span class="side-score num '+(pb>pa?"lead":"trail")+'">'+round(pb)+'</span></div>'+
      '</div>'+
      '<div class="bar"><i style="width:'+(pa/total*100).toFixed(1)+'%"></i><i style="width:'+(pb/total*100).toFixed(1)+'%"></i></div>';
    out.appendChild(el);
  });
}

function starterCount(m){ return (m.starters||[]).filter(s => s && s !== "0").length; }
function rowHTML(name, pts, win){
  return '<div class="row'+(win?" win":"")+'"><span class="row-name">'+esc(name)+'</span>'+
         '<span class="row-score num">'+round(pts)+'</span></div>';
}

function renderStandings(teams){
  teams.sort((a,b) => (b.w - a.w) || (b.pf - a.pf));
  const cut = Math.min(6, Math.floor(teams.length/2));
  let html = '<table><thead><tr><th>Team</th><th>Rec</th><th>PF</th></tr></thead><tbody>';
  teams.forEach((t,i) => {
    html += '<tr'+(i === cut-1 ? ' class="cut"' : '')+'>'+
      '<td><span class="seed num">'+(i+1)+'</span><span class="tname">'+esc(t.name)+'</span></td>'+
      '<td class="num">'+t.w+'-'+t.l+(t.t?"-"+t.t:"")+'</td>'+
      '<td class="num">'+Math.round(t.pf)+'</td></tr>';
  });
  $("standingsBody").innerHTML = html + '</tbody></table>';
}

async function loadNames(){
  $("names").disabled = true; $("names").textContent = "Downloading 5MB…";
  try{
    PLAYERS = await get("/players/nfl?active=true");
    const n = Object.keys(PLAYERS).length;
    note("<strong>Loaded "+n.toLocaleString()+" players</strong>That single request is roughly 5MB. Sleeper asks you to call it no more than once a day — which is exactly why a real version needs a server to cache it instead of re-downloading it for every visitor.");
    $("names").textContent = "Player names loaded";
  }catch(e){
    note("<strong>Player map failed</strong>"+e.message, true);
    $("names").disabled = false; $("names").textContent = "Load player names";
  }
}

function esc(s){ const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }

$("go").addEventListener("click", load);
$("names").addEventListener("click", loadNames);
$("lid").addEventListener("keydown", e => { if(e.key === "Enter") load(); });

const pre = new URLSearchParams(location.search).get("league");
if(pre){ $("lid").value = pre; load(); }
</script>
</body>
</html>
